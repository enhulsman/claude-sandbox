# ══════════════════════════════════════════════════════════════
# Claude Sandbox — Profile Configuration
# ══════════════════════════════════════════════════════════════
#
# Each profile defines three things:
#   filesystem.read_only  — paths Claude can read but not write
#   filesystem.blocked    — paths Claude cannot access at all
#   filesystem.writable   — paths Claude can read AND write
#   network.allowed_domains — domains Claude can reach via the proxy
#
# Paths support ~ for home directory expansion.
# Select a profile at launch with: claude-sandbox --profile NAME
#
# The workspace (~/claude-workspace by default) is always writable
# regardless of profile, and does not need to be listed.


# ─────────────────────────────────────────────────────────────
# NIXOS-ADMIN: System diagnosis and configuration on NixOS
# ─────────────────────────────────────────────────────────────
[profile.nixos-admin]
description = "NixOS system diagnosis and configuration"

[profile.nixos-admin.filesystem]
read_only = [
    "/etc/nixos",
    "/etc/hostname",
    "/etc/hosts",
    "/etc/os-release",
    "/etc/machine-id",
    "/etc/systemd",
    "/etc/resolv.conf",
    "/etc/ssl",
    "/sys",
    "/nix",
    "/var/log",
    "/run/current-system",
    # Git config (metadata only, not credentials)
    "~/.gitconfig",
    "~/.config/git",
]
blocked = [
    "~/.ssh",
    "~/.gnupg",
    "~/.aws",
    "~/.config/gcloud",
    "~/.docker",
    "~/.kube/config",
    "/etc/shadow",
    "/etc/gshadow",
    "/etc/security/opasswd",
    "~/.local/share/keyrings",
    "~/.mozilla",
    "~/.config/chromium",
    "~/.config/google-chrome",
    "~/.password-store",
    "~/.netrc",
    # Git credential stores
    "~/.git-credentials",
    "~/.cache/git",
    "~/.config/gh",
]
writable = [
]

[profile.nixos-admin.network]
allowed_domains = [
    "api.anthropic.com",
    "platform.claude.com",
    "raw.githubusercontent.com",
    "statsig.anthropic.com",
    "docs.claude.com",
]
recognized_domains = [
    # Known Claude telemetry — blocked but expected, excluded from risk scoring
    "datadoghq.com",        # Anthropic monitoring (e.g. http-intake.logs.us5.datadoghq.com)
    "sentry.io",            # Error reporting
]

[profile.nixos-admin.environment]
# Additional env vars to pass through (for MCP support etc.)
passthrough = []


# ─────────────────────────────────────────────────────────────
# DEV: Software development in a project directory
# ─────────────────────────────────────────────────────────────
[profile.dev]
description = "Software development — project dir + system libs"

[profile.dev.filesystem]
read_only = [
    "/nix",
    "/usr",
    "/lib",
    "/etc/resolv.conf",
    "/etc/ssl",
    "/etc/hosts",
    "~/.claude-config",
    "~/.cache",
    # Session screenshots
    "~/Pictures/Screenshots/",
    # Icon checking
    "~/.nix-profile/share/icons/",
    "~/.local/share/icons/",
    "~/.local/share/applications/",
    "/run/current-system",
    "~/Documents/homelab-docs-site/",
    # Git config (metadata only, not credentials)
    "~/.gitconfig",
    "~/.config/git",
]
blocked = [
    "~/.ssh",
    "~/.gnupg",
    "~/.aws",
    "~/.config/gcloud",
    "~/.docker",
    "~/.kube/config",
    "/etc/shadow",
    "~/.local/share/keyrings",
    "~/.mozilla",
    "~/.config/chromium",
    "~/.config/google-chrome",
    "~/.password-store",
    "~/.netrc",
    # Git credential stores
    "~/.git-credentials",
    "~/.cache/git",
    "~/.config/gh",
    # macOS Keychain (harmless on Linux)
    "~/Library/Keychains",
]
writable = [
    ".",
    "~/.dotfiles",
    "~/.local/share/ambxst-patched",
]

[profile.dev.network]
allowed_domains = [
    # Anthropic (required)
    "api.anthropic.com",
    "platform.claude.com",
    "statsig.anthropic.com",
    "docs.claude.com",
    "support.anthropic.com",

    # GitHub
    "github.com",
    "raw.githubusercontent.com",
    "docs.github.com",

    # Rust
    "crates.io",
    "index.crates.io",
    "static.crates.io",
    "doc.rust-lang.org",
    "docs.rs",
    "rust-lang.org",

    # Nix/NixOS
    "nixos.org",
    "nixos.wiki",
    "wiki.nixos.org",
    "nix.dev",
    "search.nixos.org",

    # Python
    "pypi.org",
    "files.pythonhosted.org",
    "docs.python.org",
    "readthedocs.io",
    "*.readthedocs.io",

    # Node/JS
    "registry.npmjs.org",

    # Linux docs
    "wiki.archlinux.org",
    "man7.org",
    "kernel.org",

    # General reference
    "stackoverflow.com",
    "en.wikipedia.org",

    # Project-specific
    "rustdesk.com",

    # Personal dev domains
    "hulsman.dev",
    "*.hulsman.dev",
    "*.arc8.dev",
]
recognized_domains = [
    # Known Claude telemetry — blocked but expected, excluded from risk scoring
    "datadoghq.com",        # Anthropic monitoring (e.g. http-intake.logs.us5.datadoghq.com)
    "sentry.io",            # Error reporting
]
port_forwards = [
    "3100",
]

[profile.dev.services]
# Systemd user services to ensure are running before sandbox launch.
# Each entry is a unit name (without .service suffix).
# Uses: systemctl --user start <name>  (idempotent — no-op if already running)
pre_start = [
    "docker-mcp",
]

[profile.dev.environment]
# Additional env vars to pass through (for MCP support etc.)
passthrough = []


# ─────────────────────────────────────────────────────────────
# STRICT: Maximum isolation for auditing untrusted repos
# ─────────────────────────────────────────────────────────────
[profile.strict]
description = "Maximum isolation — for untrusted repos"

[profile.strict.filesystem]
read_only = [
    "/nix/store",
    "/usr/lib",
    "/usr/bin",
    "/bin",
    "/lib",
    "/etc/ssl",
    "/etc/resolv.conf",
]
blocked = [
    "~",
]
writable = [
]

[profile.strict.network]
allowed_domains = [
    "api.anthropic.com",
    "platform.claude.com",
    "statsig.anthropic.com",
]
recognized_domains = [
    # Known Claude telemetry — blocked but expected, excluded from risk scoring
    "datadoghq.com",        # Anthropic monitoring (e.g. http-intake.logs.us5.datadoghq.com)
    "sentry.io",            # Error reporting
]

[profile.strict.environment]
# Additional env vars to pass through (for MCP support etc.)
passthrough = []


# ─────────────────────────────────────────────────────────────
# MACOS-ADMIN: macOS system diagnosis (Homebrew, launchd, etc.)
# ─────────────────────────────────────────────────────────────
[profile.macos-admin]
description = "macOS system diagnosis and configuration"

[profile.macos-admin.filesystem]
read_only = [
    "/Library",
    "/System",
    "/usr",
    "/private/etc",
    "/private/var/log",
    "/opt/homebrew",
    "/Applications",
    # Git config (metadata only, not credentials)
    "~/.gitconfig",
    "~/.config/git",
]
blocked = [
    "~/.ssh",
    "~/.gnupg",
    "~/.aws",
    "~/.config/gcloud",
    "~/.docker",
    "~/Library/Keychains",
    "~/Library/Cookies",
    "~/Library/Application Support/Google/Chrome",
    "~/Library/Application Support/Firefox",
    "~/.netrc",
    "~/.password-store",
    # Git credential stores
    "~/.git-credentials",
    "~/.cache/git",
    "~/.config/gh",
]
writable = [
]

[profile.macos-admin.network]
allowed_domains = [
    "api.anthropic.com",
    "statsig.anthropic.com",
]
recognized_domains = [
    # Known Claude telemetry — blocked but expected, excluded from risk scoring
    "datadoghq.com",        # Anthropic monitoring (e.g. http-intake.logs.us5.datadoghq.com)
    "sentry.io",            # Error reporting
]

[profile.macos-admin.environment]
# Additional env vars to pass through (for MCP support etc.)
passthrough = []
